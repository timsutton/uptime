on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner image to use'
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Configure remote cache
        env:
          BAZEL_REMOTE_BASIC_AUTH: ${{ secrets.BAZEL_REMOTE_BASIC_AUTH }}
        run: |
          set -euo pipefail

          # CI starts with an empty disk cache, so skip writing every remote
          # cache download to it as well.
          echo 'build --disk_cache=' >>~/.bazelrc

          # Secrets are unavailable to pull requests from forks.
          if [[ -z "${BAZEL_REMOTE_BASIC_AUTH}" ]]; then
            echo "BAZEL_REMOTE_BASIC_AUTH is unavailable; building without the remote cache."
            exit 0
          fi

          cat >>~/.bazelrc <<EOF
          build --config=remote_cache
          build:remote_cache "--remote_header=Authorization=Basic ${BAZEL_REMOTE_BASIC_AUTH}"
          EOF
      - name: Get cache path
        id: get-cache-path
        run: |
          # Only cache downloaded archives; the sibling contents/ directory holds
          # extracted repos, which Bazel can recreate from these archives.
          echo "bazel_repo_cache_path=$(bazel info repository_cache)/content_addressable" >>"$GITHUB_OUTPUT"
      - name: Restore repo cache
        uses: actions/cache/restore@v6
        id: restore-cache
        with:
          path: ${{ steps.get-cache-path.outputs.bazel_repo_cache_path }}
          key: bazel-repo-${{ inputs.runner }}-v2
      - name: Build
        run: ./script/build.sh
      - name: Stage compiled artifacts
        run: ./script/stage.sh
      - name: Archive built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ inputs.runner }}
          path: artifacts
      - name: Save repo cache
        uses: actions/cache/save@v6
        id: cache
        if: github.ref == 'refs/heads/main'
        with:
          path: ${{ steps.get-cache-path.outputs.bazel_repo_cache_path }}
          key: bazel-repo-${{ inputs.runner }}-v2

  test:
    needs: build
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: binaries-${{ inputs.runner }}
          path: artifacts
      - name: Test
        run: ./script/test.sh
